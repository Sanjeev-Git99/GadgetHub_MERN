services:
  - type: web
    name: gadgethub
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --prefix frontend && npm run build --prefix frontend && npm ci --prefix backend
    startCommand: npm start --prefix backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: POSTGRES_SSL
        value: "true"
      - key: POSTGRES_URL
        sync: false
      - key: MONGO_URL
        sync: false
